    <script>
        (function() {
            // === Read query parameter (replaces PHP $_GET['track_no']) ===
            var params = new URLSearchParams(window.location.search);
            var trackingNo = params.get('track_no');

            // === Sanitize: strip HTML tags & trim (replaces PHP htmlspecialchars) ===
            function sanitize(str) {
                if (!str) return '';
                var div = document.createElement('div');
                div.textContent = str.trim();
                return div.innerHTML;
            }

            var safeTrackingNo = sanitize(trackingNo);

            if (safeTrackingNo) {
                // ===== Show Tracking View =====
                document.getElementById('trackingView').style.display = 'block';
                document.getElementById('searchView').style.display = 'none';

                // Pre-fill input
                document.getElementById('trackingInput').value = safeTrackingNo;

                // Set status link
                document.getElementById('statusLink').href = 'statusmm.php?track_no=' + encodeURIComponent(safeTrackingNo);
                document.getElementById('statusLinkText').textContent = safeTrackingNo;

                // Set iframe URL based on device type
                var iframe = document.getElementById('trackingIframe');
                if (window.innerWidth <= 768) {
                    // Mobile
                    iframe.src = 'https://spx.co.th/m/tracking-detail/' + encodeURIComponent(safeTrackingNo);
                    iframe.style.top = '-7rem';
                    iframe.style.height = '110%';
                } else {
                    // PC / Desktop
                    iframe.src = 'https://spx.co.th/track?' + encodeURIComponent(safeTrackingNo);
                    iframe.style.top = '-170px';
                    iframe.style.height = '130%';
                }
            } else {
                // ===== Show Search Form Only =====
                document.getElementById('trackingView').style.display = 'none';
                document.getElementById('searchView').style.display = 'block';
            }
        })();
    </script>
